# Development settings (the DLLs in dll\target\release and probe-dll\target\release find this file in a folder
# above them). package: the test package, relative to this file; package_<exe name> wins for that game.
package = tests/mod
package_eldenring = tests/mod-er

# Only the research probe reads this: boot = patch the disk fallback at load, on_reload = on the first F7.
disk_fallback = boot
